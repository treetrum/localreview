name: Preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy preview to Cloudflare Pages
    # Fork PRs don't get secrets, so they can't deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/preview-snapshot.ts
      # Fails harmlessly once the project exists; real problems surface in the deploy step.
      - name: Ensure Pages project exists
        run: bunx wrangler@4 pages project create localreview --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=localreview --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            Built from ${{ github.event.pull_request.head.sha }}, showing a demo diff. Deployment: ${{ steps.deploy.outputs.deployment-url }}
